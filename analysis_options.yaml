# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# This enables the 'recommended' set of lints from `package:lints`, matching
# the sibling Omny packages. CI runs `dart analyze --fatal-infos
# --fatal-warnings`, so the recommended set is enforced strictly.

include: package:lints/recommended.yaml

analyzer:
  exclude:
    # `json_serializable` output; regenerated by `dart run build_runner build`.
    - "**/*.g.dart"
  errors:
    # The generated `*.g.dart` parts are excluded above, but the analyzer still
    # reports their `part` directives from the owning library.
    unused_element: warning

# For more information about the core and recommended set of lints, see
# https://dart.dev/go/core-lints
